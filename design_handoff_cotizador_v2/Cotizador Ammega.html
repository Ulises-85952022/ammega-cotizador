<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammega Cotizador · B2B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'DM Sans', system-ui, -apple-system, sans-serif;
    --font-display: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

    /* Defaults — overwritten on mount by app.jsx */
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface-2: #f3f3f0;
    --border: oklch(92% 0.005 180);
    --text: oklch(18% 0.008 200);
    --text-mute: oklch(50% 0.012 200);
    --accent: oklch(46% 0.08 195);
    --accent-fg: #ffffff;
    --accent-soft: oklch(95% 0.025 195);
    --accent-glow: oklch(46% 0.08 195 / 0.12);
    --accent-shadow: oklch(46% 0.08 195 / 0.4);
    --accent-2: oklch(54% 0.14 50);
    --accent-2-soft: oklch(96% 0.025 50);
    --ok-bg: oklch(94% 0.04 155);
    --ok-fg: oklch(42% 0.12 155);
    --warn-bg: oklch(94% 0.05 75);
    --warn-fg: oklch(48% 0.14 60);
    --err-bg: oklch(94% 0.04 25);
    --err-fg: oklch(48% 0.18 25);
  }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: #0a0a0f;
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, oklch(20% 0.05 195) 0%, #0a0a0f 60%);
    position: relative;
  }

  /* Subtle grid background on desktop */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  /* Mobile-first: full viewport */
  @media (max-width: 600px) {
    body { background: var(--bg); }
    body::before { display: none; }
    .ammega-shell { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* Desktop: contain in phone-sized shell */
  .ammega-shell {
    width: 390px; height: 844px;
    overflow: hidden;
    border-radius: 44px;
    background: var(--bg);
    box-shadow:
      0 50px 100px -20px rgba(0,0,0,0.7),
      0 0 0 12px oklch(15% 0.005 200),
      0 0 0 13px oklch(35% 0.008 200);
    position: relative;
    z-index: 1;
  }

  /* Desktop label */
  .desktop-tag {
    position: fixed;
    top: 24px; left: 24px;
    display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.5);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    z-index: 10;
  }
  .desktop-tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: oklch(70% 0.15 155);
    box-shadow: 0 0 12px oklch(70% 0.15 155);
  }
  @media (max-width: 600px) { .desktop-tag { display: none; } }

  /* Animations */
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    60% { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    from { transform: rotate(0); }
    to { transform: rotate(360deg); }
  }

  /* Hide scrollbars where needed */
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  /* Slim scrollbars elsewhere */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Make focus rings visible but on-brand */
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button { font-family: var(--font); }

  /* Body element-base typography */
  input, select, textarea, button { font-family: inherit; color: inherit; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
</head>
<body>

<div class="desktop-tag">Ammega Cotizador · v2</div>

  <div id="root" style="width:100%;height:100%;"></div>
</div>

</html>
